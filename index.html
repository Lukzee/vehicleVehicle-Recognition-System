<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Recognition System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 0;
            margin: 0;
            background-color: #f4f4f4;
        }

        #container {
            max-width: 75%;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            margin-top: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 20px;
            font-size: 16px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #image-preview {
            margin-bottom: 20px;
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        #label-container {
            margin-top: 20px;
            font-size: 20px;
            color: #007BFF;
            text-align: left;
        }

        .prediction {
            font-size: 18px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #007BFF;
            border-radius: 5px;
            background-color: #f0f8ff;
            text-align: left;
        }

        @media screen and (max-width: 600px) {
            #container {
                width: 100%;
                padding: 15px;
            }

            input[type="file"] {
                /* width: 100%; */
                font-size: 14px;
            }

            .prediction {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Vehicle  Recognition System</h1>
        <input type="file" id="image-upload" accept="image/*">
        <img id="image-preview" alt="" />
        <div id="label-container">
            <strong>Vehicle Make, Model, and Year:</strong>
            <div id="predictions"></div>
        </div>
    </div>

    <script src="js/tf.min.js"></script>
    <script src="js/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const modelURLBase = "./my_model/";

        let model, maxPredictions;

        // Load the image model and setup the file upload
        async function init() {
            const modelURL = modelURLBase + "model.json";
            const metadataURL = modelURLBase + "metadata.json";

            // Load the model and metadata
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Handle file upload
            const fileInput = document.getElementById('image-upload');
            fileInput.addEventListener('change', handleImageUpload);
        }

        // Handle the uploaded image
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Preview the uploaded image
            const imgPreview = document.getElementById('image-preview');
            imgPreview.src = window.URL.createObjectURL(file);
            imgPreview.style.display = 'block';

            // Create an image element for prediction
            const img = document.createElement('img');
            img.src = window.URL.createObjectURL(file);

            // Wait for the image to load before prediction
            img.onload = async () => {
                const prediction = await model.predict(img);
                displayPredictions(prediction);
            };
        }

        // Display predictions based on confidence levels
        function displayPredictions(predictions) {
            const predictionContainer = document.getElementById('predictions');
            predictionContainer.innerHTML = '';  // Clear previous predictions

            // Sort predictions by confidence
            predictions.sort((a, b) => b.probability - a.probability);

            // Display format: Vehicle Make, Model, and Year
            const topPrediction = predictions[0];
            const secondPrediction = predictions[1];

            if (topPrediction.probability > 0.9) {
                predictionContainer.innerHTML += `
                    <div class="prediction">
                        ${topPrediction.className} <br>
                        Confidence: ${(topPrediction.probability * 100).toFixed(2)}%
                    </div>
                `;
            } else {
                predictionContainer.innerHTML += `
                    <div class="prediction">
                        ${topPrediction.className} <br>
                        Confidence: ${(topPrediction.probability * 100).toFixed(2)}%
                    </div>
                    <div class="prediction">
                        ${secondPrediction.className} <br>
                        Confidence: ${(secondPrediction.probability * 100).toFixed(2)}%
                    </div>
                `;
            }
        }

        // Initialize the model
        init();
    </script>
</body>
</html>
